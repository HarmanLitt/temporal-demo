services:
  postgresql:
    image: postgres:16
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    ports:
      - "5432:5432"
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U temporal']
      interval: 5s
      timeout: 5s
      retries: 12

  temporal:
    image: temporalio/auto-setup:1.28.0
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgresql
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.34.0
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:5173
    ports:
      - "8233:8080"

  order-api:
    build: .
    command: npm run service:order-api
    ports:
      - "3001:3001"
    environment:
      ORDER_API_PORT: 3001
      TEMPORAL_ADDRESS: temporal:7233
      ORDER_STATUS_BASE_URL: http://order-status-service:3002
    depends_on:
      - temporal
      - order-status-service

  worker:
    build: .
    command: npm run service:worker
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      ORDER_STATUS_BASE_URL: http://order-status-service:3002
      DEMO_POS_FAILURES_BEFORE_SUCCESS: 1
    depends_on:
      - temporal
      - order-status-service

  order-status-service:
    build: .
    command: npm run service:status
    ports:
      - "3002:3002"
    environment:
      ORDER_STATUS_PORT: 3002
      ORDER_STATUS_DB_PATH: /app/data/order-status.db
    volumes:
      - order-status-data:/app/data

volumes:
  order-status-data:
